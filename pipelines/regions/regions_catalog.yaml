  - region_id: ph
    display_name: "Philippines (Luzon, Metro Manila, Visayas & Mindanao)"
    country_codes: ["PH"]
    pbf_source: "/data/maps/philippines-latest.osm.pbf"
    bbox: [116.85, 4.55, 126.95, 21.15]

  - region_id: vn
    display_name: "Vietnam (Hanoi, Da Nang, Ho Chi Minh City & Mekong Delta)"
    country_codes: ["VN"]
    pbf_source: "/data/maps/vietnam-latest.osm.pbf"
    bbox: [102.14, 8.35, 109.50, 23.40]

  - region_id: mm
    display_name: "Myanmar (Yangon, Naypyidaw, Mandalay & Border Highways)"
    country_codes: ["MM"]
