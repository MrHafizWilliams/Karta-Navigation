[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karta-api"
version = "0.3.0"
description = "Karta Navigation Platform — Core Spatial, Multi-Modal Routing, MY/SG/BN Toll Engine, Real-Time Crowdsourcing & Smart Commuter API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "asyncpg==0.30.0",
    "redis==5.2.0",
    "httpx==0.28.0",
    "tzdata==2024.2",
    "grpcio==1.68.1",
]

[project.optional-dependencies]
migrations = [
    "alembic==1.14.0",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "ruff==0.8.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
